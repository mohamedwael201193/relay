name: ci

on:
  push:
    branches: [main, master, feat/**]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: policy
        run: |
          extra=$(git ls-files '*.md' | grep -vE '^README.md$' || true)
          if [ -n "$extra" ]; then echo "only README.md may be tracked:" && echo "$extra" && exit 1; fi
          if git ls-files | grep -E '(^\.env$|^\.env\.local$|^\.env\.testnet$|^\.env\.mainnet$|HISTORY.md|^docs/evidence/)'; then
            echo "secret or local-only path is tracked"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-frontend-mocks.mjs
      - run: pnpm test
      - run: pnpm typecheck

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install Forge
        run: |
          curl -fsSL -o foundry.tar.gz https://github.com/foundry-rs/foundry/releases/download/v1.3.0/foundry_v1.3.0_linux_amd64.tar.gz
          tar -xzf foundry.tar.gz
          sudo install -m 755 forge /usr/local/bin/forge
          forge --version
      - run: pnpm install --frozen-lockfile
      - run: git clone --depth 1 https://github.com/foundry-rs/forge-std contracts/lib/forge-std
      - run: forge test -vv

  frontend:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_PRIVY_APP_ID: cmtuwy7ib00d30cjpkl8dzpqk
      NEXT_PUBLIC_RELAY_API_URL: https://relay-api-71gi.onrender.com
      NEXT_PUBLIC_NETWORK: shannon
      NEXT_PUBLIC_CHAIN_ID: "50312"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: node scripts/check-frontend-mocks.mjs
      - name: install frontend
        working-directory: frontend
        run: pnpm install
      - name: build frontend
        working-directory: frontend
        run: npx next build
      - name: scan bundle for secrets
        run: node scripts/check-frontend-bundle.mjs
