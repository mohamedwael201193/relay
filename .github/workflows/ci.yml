name: ci

on:
  push:
    branches: [main, master, feat/**]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: policy
        run: |
          extra=$(git ls-files '*.md' | grep -vE '^README.md$' || true)
          if [ -n "$extra" ]; then echo "only README.md may be tracked:" && echo "$extra" && exit 1; fi
          if git ls-files | grep -E '(^\.env$|^\.env\.local$|^\.env\.testnet$|^\.env\.mainnet$|HISTORY.md|^docs/evidence/)'; then
            echo "secret or local-only path is tracked"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pnpm install --frozen-lockfile
      - run: git clone --depth 1 https://github.com/foundry-rs/forge-std contracts/lib/forge-std
      - run: forge test -vv
