<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-label="RELAY autonomous lap loop">
  <rect width="720" height="980" fill="#111111"/>
  <text x="360" y="48" text-anchor="middle" fill="#C8F542" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="4">THE LOOP</text>
  <text x="360" y="74" text-anchor="middle" fill="#F4F1E8" font-family="Georgia, 'Times New Roman', serif" font-size="28">Deploy once. The streak runs itself.</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#F4F1E8">
    <g transform="translate(210,100)">
      <rect width="300" height="44" rx="6" fill="#1C1C1C" stroke="#C8F542" stroke-width="1.5"/>
      <text x="150" y="28" text-anchor="middle">DEPLOY</text>
    </g>
    <g transform="translate(210,160)">
      <rect width="300" height="44" rx="6" fill="#1C1C1C" stroke="#3A3A3A"/>
      <text x="150" y="28" text-anchor="middle">FUND</text>
    </g>
    <g transform="translate(210,220)">
      <rect width="300" height="44" rx="6" fill="#1C1C1C" stroke="#3A3A3A"/>
      <text x="150" y="28" text-anchor="middle">SCAN</text>
    </g>
    <g transform="translate(210,280)">
      <rect width="300" height="44" rx="6" fill="#1C1C1C" stroke="#3A3A3A"/>
      <text x="150" y="28" text-anchor="middle">ORDER</text>
    </g>
    <g transform="translate(210,340)">
      <rect width="300" height="44" rx="6" fill="#1C1C1C" stroke="#C8F542" stroke-width="1.5"/>
      <text x="150" y="28" text-anchor="middle">FILL</text>
    </g>
    <g transform="translate(210,400)">
      <rect width="300" height="44" rx="6" fill="#1C1C1C" stroke="#3A3A3A"/>
      <text x="150" y="28" text-anchor="middle">HOLD</text>
    </g>
    <g transform="translate(210,460)">
      <rect width="300" height="44" rx="6" fill="#1C1C1C" stroke="#3A3A3A"/>
      <text x="150" y="28" text-anchor="middle">CLOSE</text>
    </g>
    <g transform="translate(210,520)">
      <rect width="300" height="44" rx="6" fill="#1C1C1C" stroke="#3A3A3A"/>
      <text x="150" y="28" text-anchor="middle">ORACLE</text>
    </g>
    <g transform="translate(210,580)">
      <rect width="300" height="44" rx="6" fill="#1C1C1C" stroke="#C8F542" stroke-width="1.5"/>
      <text x="150" y="28" text-anchor="middle">REACTIVITY</text>
    </g>
    <g transform="translate(210,640)">
      <rect width="300" height="44" rx="6" fill="#1C1C1C" stroke="#3A3A3A"/>
      <text x="150" y="28" text-anchor="middle">SETTLEMENT</text>
    </g>
    <g transform="translate(210,700)">
      <rect width="300" height="44" rx="6" fill="#1C1C1C" stroke="#3A3A3A"/>
      <text x="150" y="28" text-anchor="middle">REDEEM</text>
    </g>
    <g transform="translate(210,760)">
      <rect width="300" height="44" rx="6" fill="#1C1C1C" stroke="#C8F542" stroke-width="1.5"/>
      <text x="150" y="28" text-anchor="middle">STREAK</text>
    </g>
    <g transform="translate(210,820)">
      <rect width="300" height="44" rx="6" fill="#1C1C1C" stroke="#3A3A3A"/>
      <text x="150" y="28" text-anchor="middle">RE-ARM</text>
    </g>
    <g transform="translate(210,880)">
      <rect width="300" height="44" rx="6" fill="#C8F542"/>
      <text x="150" y="28" text-anchor="middle" fill="#111111">NEXT LAP</text>
    </g>
  </g>
  <g stroke="#C8F542" stroke-width="1.5" fill="#C8F542">
    <line x1="360" y1="144" x2="360" y2="160"/>
    <line x1="360" y1="204" x2="360" y2="220"/>
    <line x1="360" y1="264" x2="360" y2="280"/>
    <line x1="360" y1="324" x2="360" y2="340"/>
    <line x1="360" y1="384" x2="360" y2="400"/>
    <line x1="360" y1="444" x2="360" y2="460"/>
    <line x1="360" y1="504" x2="360" y2="520"/>
    <line x1="360" y1="564" x2="360" y2="580"/>
    <line x1="360" y1="624" x2="360" y2="640"/>
    <line x1="360" y1="684" x2="360" y2="700"/>
    <line x1="360" y1="744" x2="360" y2="760"/>
    <line x1="360" y1="804" x2="360" y2="820"/>
    <line x1="360" y1="864" x2="360" y2="880"/>
  </g>
  <path d="M 510 902 L 640 902 L 640 242 L 510 242" fill="none" stroke="#3A3A3A" stroke-width="1.25" stroke-dasharray="4 6"/>
  <polygon points="510,242 520,236 520,248" fill="#3A3A3A"/>
  <text x="650" y="580" fill="#8A8A8A" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" transform="rotate(90 650 580)">same vault</text>
</svg>
