services:
  - type: web
    name: relay-api
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile --prod=false
    startCommand: pnpm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: RELAY_NETWORK
        value: shannon
      - key: MAINNET_TRADING_ENABLED
        value: "false"
      - key: RELAY_RUN_WORKER
        value: "true"

  - type: worker
    name: relay-worker
    runtime: node
    plan: starter
    buildCommand: pnpm install --frozen-lockfile --prod=false
    startCommand: pnpm worker
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: RELAY_NETWORK
        value: shannon
      - key: MAINNET_TRADING_ENABLED
        value: "false"
