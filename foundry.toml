[profile.default]
src = "contracts/src"
out = "contracts/out"
test = "contracts/test"
libs = ["contracts/lib"]
solc = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "./" }]
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "@somnia-chain/reactivity-contracts/=node_modules/@somnia-chain/reactivity-contracts/",
  "forge-std/=contracts/lib/forge-std/src/"
]

[rpc_endpoints]
shannon = "https://dream-rpc.somnia.network"
mainnet = "https://api.infra.mainnet.somnia.network"
